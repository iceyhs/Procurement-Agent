[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-agent"
version = "0.1.0"
description = "Procurement quote review agent using OpenRouter"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
procurement-agent = "procurement_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
